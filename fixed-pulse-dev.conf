server {
    server_name pulse-dev.bioptrics.com;

    # Main location - proxy to root, not /pulse-dev
    location / {
        proxy_pass http://localhost:3000;  # Changed: removed /pulse-dev
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # CRITICAL: Use main domain for Host header
        proxy_set_header Host pulse.bioptrics.com;  # Changed: use main domain
        
        proxy_cache_bypass $http_upgrade;

        # Pass original subdomain info for detection
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Subdomain $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add timeouts for WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Serve static assets - redirect to main domain
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)(\?.*)?$ {
        return 301 https://pulse.bioptrics.com$request_uri;  # Changed: redirect to main domain
    }
    
    # Handle Meteor's bundled JS files specifically
    location ~* \.js\?meteor_js_resource=true$ {
        return 301 https://pulse.bioptrics.com$request_uri;  # Changed: redirect to main domain
    }

    location /sockjs/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # CRITICAL: Use main domain for SockJS too
        proxy_set_header Host pulse.bioptrics.com;  # Changed: use main domain

        # Pass subdomain info
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Subdomain $host;

        # Standard headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-polling
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;

        # Disable buffering for real-time communication
        proxy_buffering off;
        proxy_cache off;
    }

    access_log /var/log/nginx/pulse-dev.bioptrics.com.access.log;
    error_log /var/log/nginx/pulse-dev.bioptrics.com.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pulse-dev.bioptrics.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pulse-dev.bioptrics.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pulse-dev.bioptrics.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name pulse-dev.bioptrics.com;
    listen 80;
    return 404; # managed by Certbot
}

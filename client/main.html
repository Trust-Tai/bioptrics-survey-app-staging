<head>
  <title>Bioptrics Pulse Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  
  <!-- Fixed theme initialization - no theme switching -->
  <script>
    (function() {
      // Fixed theme colors - no switching allowed
      const fixedTheme = {
        primary: '#be5f41',
        secondary: '#c55501',
        accent: '#d29b0a',
        background: '#f8f9fa',
        text: '#2e2e2e',
        sidebar: 'transparent',
        sidebarText: '#2c2c2c'
      };
      
      // Apply fixed theme colors to CSS custom properties immediately
      const root = document.documentElement;
      root.style.setProperty('--color-primary', fixedTheme.primary);
      root.style.setProperty('--color-secondary', fixedTheme.secondary);
      root.style.setProperty('--color-accent', fixedTheme.accent);
      root.style.setProperty('--color-background', fixedTheme.background);
      root.style.setProperty('--color-text', fixedTheme.text);
      root.style.setProperty('--color-sidebar', fixedTheme.sidebar);
      root.style.setProperty('--color-sidebar-text', fixedTheme.sidebarText);
      root.style.setProperty('--bs-primary', fixedTheme.primary);
      root.style.setProperty('--bs-secondary', fixedTheme.secondary);
      
      console.log('🎨 Fixed Theme - CSS Variables applied:', {
        primary: fixedTheme.primary,
        secondary: fixedTheme.secondary,
        sidebar: fixedTheme.sidebar,
        sidebarText: fixedTheme.sidebarText,
        timestamp: new Date().toISOString()
      });
      
      // Wait for body to be available, then mark as loaded
      function markThemeLoaded() {
        if (document.body) {
          document.body.setAttribute('data-theme-loaded', 'true');
        } else {
          // If body isn't ready yet, wait a bit and try again
          setTimeout(markThemeLoaded, 10);
        }
      }
      
      // Try to mark immediately, or wait for DOM
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', markThemeLoaded);
      } else {
        markThemeLoaded();
      }
    })();
  </script>
</head>

<body>
  <div id="react-target"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
